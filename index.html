<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>INDEX FOTO JPG</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f1f3f4;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h2 {
    color: #245b40;
}

.info {
    color: #555;
    font-size: 14px;
}

.galeri {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
}

.item {
    background: white;
    padding: 9px;
    border-radius: 7px;
    box-shadow: 0 2px 6px #0002;
    min-width: 0;
}

.item img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: #e8e8e8;
}

.nama {
    font-size: 12px;
    font-weight: bold;
    overflow-wrap: anywhere;
    margin-top: 8px;
}

.ukuran {
    font-size: 11px;
    color: #777;
    margin-top: 4px;
}
</style>
</head>

<body>

<header>
    <h2>GALERI FOTO SURVEI</h2>
    <div class="info">
        Jumlah foto: 5
    </div>
</header>

<div class="galeri">

        <div class="item">
            <a href="ATAS.jpg" target="_blank">
                <img src="ATAS.jpg" loading="lazy" alt="ATAS.jpg">
            </a>
            <div class="nama">ATAS.jpg</div>
            <div class="ukuran">263.59 KB</div>
        </div>
        

        <div class="item">
            <a href="BARAT.jpg" target="_blank">
                <img src="BARAT.jpg" loading="lazy" alt="BARAT.jpg">
            </a>
            <div class="nama">BARAT.jpg</div>
            <div class="ukuran">325.54 KB</div>
        </div>
        

        <div class="item">
            <a href="SELATAN.jpg" target="_blank">
                <img src="SELATAN.jpg" loading="lazy" alt="SELATAN.jpg">
            </a>
            <div class="nama">SELATAN.jpg</div>
            <div class="ukuran">143.99 KB</div>
        </div>
        

        <div class="item">
            <a href="TIMUR.jpg" target="_blank">
                <img src="TIMUR.jpg" loading="lazy" alt="TIMUR.jpg">
            </a>
            <div class="nama">TIMUR.jpg</div>
            <div class="ukuran">434.94 KB</div>
        </div>
        

        <div class="item">
            <a href="UTARA.jpg" target="_blank">
                <img src="UTARA.jpg" loading="lazy" alt="UTARA.jpg">
            </a>
            <div class="nama">UTARA.jpg</div>
            <div class="ukuran">324.36 KB</div>
        </div>
        
</div>

</body>
</html>
